<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>felis check-in</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <main class="overlay" aria-label="felis check-in">
      <div class="overlay-aura" aria-hidden="true"></div>
      <section class="overlay-presence" aria-hidden="true">
        <div id="orb" class="overlay-orb"></div>
      </section>
      <section class="overlay-content">
        <header class="overlay-header">
          <span class="overlay-signal" aria-hidden="true"></span>
          <span>felis check-in</span>
        </header>
        <p id="message" class="overlay-message" aria-live="polite"></p>
        <footer class="overlay-actions">
          <button id="open" class="overlay-action overlay-action--primary" type="button">
            open conversation
          </button>
          <button id="dismiss" class="overlay-action" type="button">later</button>
        </footer>
      </section>
    </main>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
