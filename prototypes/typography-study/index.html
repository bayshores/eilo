<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>felis — Typography study</title>
    <link rel="stylesheet" href="/study.css" /><script type="module" src="/study.js"></script>
  </head>
  <body>
    <header class="study-controls">
      <div class="study-title"><h1>Typography</h1><p id="font-name">A · Source Sans 3</p></div>
      <div class="type-options" role="group" aria-label="Compare typography">
        <button type="button" data-type="a" aria-pressed="true">A <span>Humanist</span></button>
        <button type="button" data-type="b" aria-pressed="false">B <span>Technical</span></button>
        <button type="button" data-type="c" aria-pressed="false">C <span>Open</span></button>
        <button type="button" data-type="current" aria-pressed="false">Previous</button>
      </div>
      <p class="study-note" id="type-description" role="status"
        >Softer letterforms; a lighter reading rhythm.</p
      >
    </header>
    <div class="preview-window"
      ><iframe src="/canvas" title="Home typography preview"></iframe
    ></div>
  </body>
</html>
