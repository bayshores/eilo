<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>eïlo activity context</title>
  </head>
  <body>
    <main>
      <h1 id="connection-heading">Allow Chrome access</h1>
      <p id="permission-consequence" class="consequence"
        >Allow Chrome so eïlo can notice the site names and titles you choose to share.</p
      >
      <button id="allow" class="primary" type="button">Allow Chrome</button>
      <button id="retry-connection" class="primary" type="button" hidden>Retry connection</button>
      <p id="status" role="status"></p>
      <p id="native-status" class="transport" role="status"></p>
      <a
        id="connection-help"
        class="connection-help"
        href="http://127.0.0.1:8765/activity-connect?client=desktop"
        hidden
        >Connection help</a
      >
      <details>
        <summary>Site exclusions &amp; privacy</summary>
        <p>Browser metadata stays local. Page text and AI sharing have separate controls.</p>
        <button id="exclude" type="button">Exclude this site</button>
        <div class="excluded" aria-labelledby="excluded-heading">
          <p id="excluded-heading">Excluded sites</p>
          <ul id="excluded-hosts"></ul>
        </div>
        <button id="remove-access" class="quiet" type="button">Remove browser access</button>
      </details>
    </main>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
